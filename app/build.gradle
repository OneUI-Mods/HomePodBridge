plugins { id 'com.android.application' }
android {
    namespace 'dev.ryuya.homepodbridge'
    compileSdk 37
    ndkVersion '30.0.14904198'
    defaultConfig {
        applicationId 'dev.ryuya.homepodbridge'
        minSdk 36
        targetSdk 37
        versionCode 36
        versionName '0.1.2-experimental'
        buildConfigField 'int', 'VOLUME_LIMIT', '100'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    buildFeatures { buildConfig true }
    buildTypes { release { debuggable false; minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '4.1.2' } }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('writeRuntimeDependencyList') {
    doLast {
        def entries = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { it.moduleVersion.id.toString() }.unique().sort()
        def output = file('build/runtime-dependencies.txt')
        output.parentFile.mkdirs()
        output.text = entries.join('\n') + '\n'
    }
}
